{% extends "base.html" %}
{% block title %}{{ code }} - {{ title }}{% endblock %}
{% block content %}
<section class="card error-page">
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn" href="{{ url_for('main.index') }}">Back to upload</a>
</section>
{% endblock %}
